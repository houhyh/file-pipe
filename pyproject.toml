[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-file-synthesis"
version = "0.1.0"
description = "Evidence-grounded, resumable office workspace synthesis"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3", "PyYAML>=6", "httpx>=0.27,<1",
  "beautifulsoup4>=4.12", "python-docx>=1.1", "openpyxl>=3.1",
  "python-pptx>=1.0", "reportlab>=4", "pypdf>=5", "XlsxWriter>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
render = ["PyMuPDF>=1.24"]

[project.scripts]
office-synth = "office_synth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
office_synth = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["online: opt-in live network integration"]
